# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g window-size latest
set -g status-position top
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
# set -g  destroy-unattached on
set -as terminal-features ",*:RGB"
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s extended-keys on
set -g extended-keys-format csi-u

setw -g mouse on
setw -g aggressive-resize on

# ==============================================================================
# PREFIX & CONFIG
# ==============================================================================
set -g prefix C-a
bind -N "Send prefix (C-a)" C-a send-prefix

bind -N "Reload tmux configuration" R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

setw -g mode-keys vi
set -g status-keys vi

# ==============================================================================
# SESSION & SYSTEM
# ==============================================================================
# "Arm on Arrival" hooks
# set-hook -g client-attached 'set-option destroy-unattached on'
# set-hook -g client-session-changed 'set-option destroy-unattached off'
# set-hook -g client-detached 'set-option destroy-unattached off'
# set-hook -g after-new-session 'set-option destroy-unattached on'
#
set-hook -g after-new-session[0] 'run-shell "tmux rename-session \"$(~/.local/bin/petname)\""'

# bind -N "New session" N new run-shell "~/.config/tmux/smart-switch new"
bind -N "New session" N new

# ==============================================================================
# WINDOW MANAGEMENT
# ==============================================================================
set-hook -g after-select-window[0] 'set status on'
set-hook -g after-select-window[1] 'run-shell "if [[ #{pane_zoomed_flag} -eq 1 ]]; then tmux resize-pane -Z; fi"'
set-hook -g after-select-pane[0] 'set status on'
set-hook -g after-select-pane[1] 'run-shell "if [[ #{pane_zoomed_flag} -eq 1 ]]; then tmux resize-pane -Z; fi"'
set-hook -g pane-focus-out[0] 'set status on'
set-hook -g pane-focus-out[1] 'run-shell "if [[ #{pane_zoomed_flag} -eq 1 ]]; then tmux resize-pane -Z; fi"'

bind -n -r -N "Select window previous" C-[ previous-window
bind -n -r -N "Select window next" C-] next-window

bind -n -r -N "Swap window previous" "C-{" swap-window -t -1 \; select-window -t -1
bind -n -r -N "Swap window next" "C-}" swap-window -t +1 \; select-window -t +1

bind -N "Close Window" Q kill-window
bind -N "Switch to last active window" Tab last-window

# ==============================================================================
# PANE MANAGEMENT
# ==============================================================================
unbind %
unbind '"'
bind -N "Split pane horizontally" v split-pane -h
bind -N "Split pane vertically" s split-pane -v
bind -N "Split pane" Enter run-shell '~/.config/tmux/smart-split'

bind -N "Select pane left" h select-pane -L
bind -N "Select pane below" j select-pane -D
bind -N "Select pane above" k select-pane -U
bind -N "Select pane right" l select-pane -R

bind -N "Swap pane left" H swap-pane -d -t "{left-of}"
bind -N "Swap pane below" J swap-pane -d -t "{down-of}"
bind -N "Swap pane above" K swap-pane -d -t "{up-of}"
bind -N "Swap pane right" L swap-pane -d -t "{right-of}"

bind -r -N "Resize pane down" M-j resize-pane -D 3
bind -r -N "Resize pane up" M-k resize-pane -U 3
bind -r -N "Resize pane left" M-h resize-pane -L 3
bind -r -N "Resize pane right" M-l resize-pane -R 3

bind -N "Zen" z resize-pane -Z \; set status
bind -N "Kill the current pane" x kill-pane
bind -N "Focus last pane" "'" last-pane

# ==============================================================================
# COPY MODE (VI STYLE)
# ==============================================================================
unbind /
bind -N "Enter copy mode" / copy-mode 

# These are bound in the copy-mode-vi table
bind -T copy-mode-vi -N "Start visual selection" v send -X begin-selection
bind -T copy-mode-vi -N "Toggle block selection" C-v send -X rectangle-toggle
bind -T copy-mode-vi -N "Copy selection and exit" y send -X copy-selection-and-cancel
bind -T copy-mode-vi -N "Cancel selection/Copy mode" Escape send -X cancel
bind -T copy-mode-vi -N "Move to start of line" H send -X start-of-line
bind -T copy-mode-vi -N "Move to end of line" L send -X end-of-line

# ==============================================================================
# HELP & POPUPS
# ==============================================================================
# This popup will now show all the notes added above
unbind ?
bind -N "Display this help list" ? display-popup -E -w 80% -h 80% "tmux list-keys -N | fzf"

# ==============================================================================
# MISC
# ==============================================================================
bind -N "Toggle status" F1 set status

# ==============================================================================
# PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.duckduckgo.com/?q='

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
# set -g @continuum-restore 'on'

# set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "mirage_dark"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'


# ==============================================================================
# PLUGINS OVERRIDES
# ==============================================================================

# Pane surfaces
setw -g window-style default
setw -g window-active-style default

# Pane borders
setw -g pane-border-style "bg=default,fg=#{@thm_mantle}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_primary}"

# Display-panes overlay
set -g display-panes-colour "default"
set -g display-panes-active-colour "default"

# Menus
setw -g menu-style "bg=default"
setw -g menu-selected-style "bg=default"
setw -g menu-border-style "bg=default"

# Popups
setw -g popup-style "bg=default"
setw -g popup-border-style "bg=default"
